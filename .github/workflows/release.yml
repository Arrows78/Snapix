# Builds a universal Snapix.app and publishes it as a GitHub release on every v* tag.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check tag matches app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $version in Resources/Info.plist"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release files
        run: |
          python3 -B -m unittest discover -s scripts/tests -q
          python3 -B scripts/release.py check

      - name: Build
        run: SNAPIX_UNIVERSAL=1 ./build.sh

      - name: Self-test
        run: |
          out=$(mktemp -d)
          build/Snapix.app/Contents/MacOS/Snapix --selftest "$out"

      - name: Package
        run: |
          ditto -c -k --keepParent build/Snapix.app "Snapix-$VERSION.zip"
          shasum -a 256 "Snapix-$VERSION.zip" > "Snapix-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          : > release-notes.md
          # Hand-written notes (docs/releases/<version>.md) when there are some, the changelog section otherwise.
          if [ -f "docs/releases/$VERSION.md" ]; then
            cat "docs/releases/$VERSION.md" >> release-notes.md
          else
            printf "## What's new in %s\n\n" "$VERSION" >> release-notes.md
            python3 -B scripts/release.py notes "$VERSION" >> release-notes.md
          fi
          echo >> release-notes.md
          cat >> release-notes.md <<'EOT'
          ## Install

          1. Download `Snapix-*.zip`, unzip it and move **Snapix.app** to `/Applications`.
          2. Grant **Screen Recording** (and **Accessibility** for automatic scrolling capture) in System Settings.

          **First launch**

          This build is signed ad hoc, not notarised, so macOS blocks the first launch. Either open **System Settings › Privacy & Security** and click **Open Anyway**, or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Snapix.app
          ```

          Universal binary (Apple Silicon and Intel), macOS 14 or later.
          EOT
          # The heredoc above keeps the step's indentation: strip it.
          sed -i.bak 's/^          //' release-notes.md && rm -f release-notes.md.bak
          gh release create "$GITHUB_REF_NAME" "Snapix-$VERSION.zip" "Snapix-$VERSION.zip.sha256" \
            --title "Snapix $VERSION" $prerelease --notes-file release-notes.md
