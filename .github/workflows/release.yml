# Builds a universal Snapix.app and publishes it as a GitHub release on every v* tag (pushed, or released by the Prepare release workflow).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (set by the Prepare release workflow)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check tag matches app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match CFBundleShortVersionString $version in Resources/Info.plist"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check release files
        run: |
          python3 -B -m unittest discover -s scripts/tests -q
          python3 -B scripts/release.py check

      - name: Import signing identity
        env:
          SIGNING_P12: ${{ secrets.SNAPIX_SIGNING_P12 }}
          SIGNING_PASSWORD: ${{ secrets.SNAPIX_SIGNING_PASSWORD }}
        run: |
          hash=$(sh scripts/ci_import_identity.sh "Snapix Local Signing")
          if [ -n "$hash" ]; then
            echo "SNAPIX_SIGN_IDENTITY=$hash" >> "$GITHUB_ENV"
          else
            echo "::notice::SNAPIX_SIGNING_P12 is not set: the build is signed ad hoc, so macOS asks for privacy permissions again after each update."
          fi

      - name: Build
        run: SNAPIX_UNIVERSAL=1 ./build.sh

      - name: Check the signature
        run: |
          if [ -n "${SNAPIX_SIGN_IDENTITY:-}" ]; then
            info=$(codesign -dv build/Snapix.app 2>&1)
            case "$info" in *Signature=adhoc*) echo "::error::Signed ad hoc although a signing identity was imported"; exit 1;; esac
            codesign --verify --deep --strict build/Snapix.app
            codesign -dr - build/Snapix.app 2>&1 | grep designated
          fi

      - name: Self-test
        run: |
          out=$(mktemp -d)
          build/Snapix.app/Contents/MacOS/Snapix --selftest "$out"

      - name: Package
        run: |
          ditto -c -k --keepParent build/Snapix.app "Snapix-$VERSION.zip"
          shasum -a 256 "Snapix-$VERSION.zip" > "Snapix-$VERSION.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          : > release-notes.md
          # Hand-written notes (docs/releases/<version>.md) when there are some, the changelog section otherwise.
          if [ -f "docs/releases/$VERSION.md" ]; then
            cat "docs/releases/$VERSION.md" >> release-notes.md
          else
            printf "## What's new in %s\n\n" "$VERSION" >> release-notes.md
            python3 -B scripts/release.py notes "$VERSION" >> release-notes.md
          fi
          echo >> release-notes.md
          cat >> release-notes.md <<'EOT'
          ## Install

          **With Homebrew**

          ```bash
          brew install arrows78/snapix/snapix
          ```

          Use the full name above: Homebrew 7 only loads casks from third-party taps you trust. After a plain `brew tap`, run `brew trust --tap arrows78/snapix` first.

          **Manually**

          1. Download `Snapix-*.zip`, unzip it and move **Snapix.app** to `/Applications`.
          2. Grant **Screen Recording** (and **Accessibility** for automatic scrolling capture) in System Settings.

          **First launch**

          This build is signed ad hoc, not notarised, so macOS blocks the first launch. Either open **System Settings › Privacy & Security** and click **Open Anyway**, or run:

          ```bash
          xattr -dr com.apple.quarantine /Applications/Snapix.app
          ```

          Universal binary (Apple Silicon and Intel), macOS 14 or later.
          EOT
          # The heredoc above keeps the step's indentation: strip it.
          sed -i.bak 's/^          //' release-notes.md && rm -f release-notes.md.bak
          gh release create "$TAG" "Snapix-$VERSION.zip" "Snapix-$VERSION.zip.sha256" \
            --title "Snapix $VERSION" $prerelease --notes-file release-notes.md

      # Needs a fine-grained token with "Contents: read and write" on Arrows78/homebrew-snapix, stored as the
      # HOMEBREW_TAP_SNAPIX_TOKEN secret of this repository. Without it the release is still published and the tap is left alone.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_SNAPIX_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_SNAPIX_TOKEN is not set: the Homebrew tap was not updated."
            exit 0
          fi
          sha=$(cut -d' ' -f1 "Snapix-$VERSION.zip.sha256")
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/Arrows78/homebrew-snapix.git" tap
          mkdir -p tap/Casks
          sh scripts/render_cask.sh "$VERSION" "$sha" > tap/Casks/snapix.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/snapix.rb
          git diff --cached --quiet && { echo "Tap already up to date."; exit 0; }
          git commit --quiet -m "snapix $VERSION"
          git push --quiet
